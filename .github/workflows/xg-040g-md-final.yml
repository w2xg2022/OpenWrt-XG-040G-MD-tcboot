name: Build_XG_040G_MD

# 与 VM 本地编译同一套做法：固定版本的 openwrt 源码 + scripts/build-baseline.sh prepare/build。
# 编完 build-baseline.sh 会自动拆固件逐项核对（scripts/baseline/verify-image.sh），缺项就失败。
# 只手动触发。

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "编完后发布 Release（否则只上传 Artifacts）"
        type: boolean
        default: false
      prerelease:
        description: "作为预发布（prerelease）"
        type: boolean
        default: true

env:
  SOURCE_REPO: https://github.com/xiangtailiang/openwrt.git
  TZ: Asia/Shanghai
  BASELINE_NO_PROXY: "1"  # 不装 HomeProxy / PassWall（本固件不带科学上网插件）

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          # squashfs-tools：verify-image.sh 拆固件用；nodejs：prepare 里用 node --check 检查 JS 语法
          sudo apt install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget \
            device-tree-compiler ccache curl perl squashfs-tools nodejs
          sudo timedatectl set-timezone "$TZ"
          node --version; python3 --version; unsquashfs -version | head -1

      - name: 拉取 openwrt 源码（固定版本）
        run: |
          REF=$(grep '^OPENWRT_REF=' scripts/build-baseline.sh | grep -o '[0-9a-f]\{40\}')
          echo "OPENWRT_REF=$REF"
          sudo mkdir -p /mnt/openwrt && sudo chown -R "$USER:$(id -gn)" /mnt/openwrt
          git init -q /mnt/openwrt/src
          cd /mnt/openwrt/src
          git remote add origin "$SOURCE_REPO"
          git fetch -q --depth 1 origin "$REF"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %s'
          echo "OPENWRT_DIR=/mnt/openwrt/src" >> "$GITHUB_ENV"
          echo "LOG_DIR=/mnt/openwrt/logs" >> "$GITHUB_ENV"
          df -h

      - name: 缓存 dl
        uses: actions/cache@v4
        with:
          path: /mnt/openwrt/src/dl
          key: xg040-final-dl-${{ hashFiles('config/xg-040g-md-baseline.config') }}
          restore-keys: |
            xg040-final-dl-
            xg040-baseline-dl-

      - name: 准备（feeds + 补丁 + defconfig）
        run: bash scripts/build-baseline.sh prepare

      - name: 上传最终 .config
        uses: actions/upload-artifact@v4
        with:
          name: defconfig-final
          path: /mnt/openwrt/logs/defconfig-final.config

      - name: 编译（含固件自动核对）
        run: bash scripts/build-baseline.sh build

      - name: 整理固件
        id: fw
        run: |
          cd "$OPENWRT_DIR/bin/targets/airoha/an7581"
          rm -rf packages
          ls -l
          echo "dir=$PWD" >> "$GITHUB_OUTPUT"
          echo "tag=$(date +%Y.%m.%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          cp "$LOG_DIR/verify-image.txt" "$PWD/verify-image.txt"

      - name: 生成 Release 说明
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SOURCE_REPO: https://github.com/xiangtailiang/openwrt
        run: |
          bash scripts/baseline/render-release-notes.sh "${{ steps.fw.outputs.dir }}" > release.md
          cat release.md

      - name: 上传固件（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: XG-040G-MD-${{ steps.fw.outputs.tag }}
          path: ${{ steps.fw.outputs.dir }}/*

      - name: 发布 Release
        if: ${{ inputs.publish }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.fw.outputs.tag }}
          bodyFile: release.md
          artifacts: ${{ steps.fw.outputs.dir }}/*
          prerelease: ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
