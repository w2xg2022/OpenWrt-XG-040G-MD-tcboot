name: Build_XG_040G_MD_Baseline

# 排查用：上游原版 + Bootstrap 主题（去掉 HomeProxy/PassWall 的变体）。
# 只手动触发，跑在 baseline-* 分支上，不影响正式固件（main / xg-040g-md-tcboot.yml）。

permissions:
  contents: write

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/xiangtailiang/openwrt.git
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget \
            device-tree-compiler ccache curl perl
          sudo timedatectl set-timezone "$TZ"

      - name: 拉取 openwrt 源码（固定版本）
        run: |
          REF=$(grep '^OPENWRT_REF=' scripts/build-baseline.sh | grep -o '[0-9a-f]\{40\}')
          echo "OPENWRT_REF=$REF"
          sudo mkdir -p /mnt/openwrt && sudo chown -R "$USER:$(id -gn)" /mnt/openwrt
          git init -q /mnt/openwrt/src
          cd /mnt/openwrt/src
          git remote add origin "$REPO_URL"
          git fetch -q --depth 1 origin "$REF"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %s'
          echo "OPENWRT_DIR=/mnt/openwrt/src" >> "$GITHUB_ENV"
          echo "LOG_DIR=/mnt/openwrt/logs" >> "$GITHUB_ENV"
          df -h

      - name: 缓存 dl
        uses: actions/cache@v4
        with:
          path: /mnt/openwrt/src/dl
          key: xg040-baseline-dl-${{ hashFiles('config/xg-040g-md-baseline.config') }}
          restore-keys: |
            xg040-baseline-dl-

      - name: 准备（feeds + 去代理改动 + defconfig）
        run: bash scripts/build-baseline.sh prepare

      - name: 上传最终 .config
        uses: actions/upload-artifact@v4
        with:
          name: baseline-defconfig-final
          path: /mnt/openwrt/logs/defconfig-final.config

      - name: 编译
        run: bash scripts/build-baseline.sh build

      - name: 整理固件
        id: fw
        run: |
          cd "$OPENWRT_DIR/bin/targets/airoha/an7581"
          rm -rf packages openwrt-imagebuilder-*.tar.zst
          ls -l
          echo "dir=$PWD" >> "$GITHUB_OUTPUT"
          echo "tag=baseline-nopxy-$(date +%Y.%m.%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: 上传固件（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: XG-040G-MD-${{ steps.fw.outputs.tag }}
          path: ${{ steps.fw.outputs.dir }}/*

      - name: 生成 Release 说明
        run: |
          cat > release.txt <<EOF
          【排查用】XG-040G-MD 基准线：上游原版 + Bootstrap 主题，去掉 HomeProxy/PassWall
          ----------------------
          构建时间：$(date +"%Y-%m-%d %H:%M")
          源码：$REPO_URL @ $(git -C "$OPENWRT_DIR" rev-parse --short HEAD)
          内核：6.12（openwrt-25.12）
          与上游能用的原版固件相比，只有两处不同：默认主题 Bootstrap（非 Argon）、不含 HomeProxy/PassWall。
          默认地址：192.168.1.1（root 无密码），网口按上游分配（网口2~4=LAN，2.5G口=WAN）。
          仅供排查 192.168.1.1 访问不到的问题，不是正式固件。
          EOF

      - name: 发布 Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.fw.outputs.tag }}
          bodyFile: release.txt
          artifacts: ${{ steps.fw.outputs.dir }}/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
