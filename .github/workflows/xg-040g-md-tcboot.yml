name: Build_XG_040G_MD_tcboot

permissions:
  contents: write
  actions: write

# 完整编译（约 1~2 小时）只手动触发；日常改设定由 xg-040g-md-ib.yml 用 ImageBuilder 几分钟出包
on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/xiangtailiang/openwrt.git
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget \
            device-tree-compiler ccache curl perl
          sudo timedatectl set-timezone "$TZ"

      - name: 拉取 openwrt 源码（固定版本）
        run: |
          REF=$(grep '^OPENWRT_REF=' scripts/build-tcboot-local.sh | grep -o '[0-9a-f]\{40\}')
          echo "OPENWRT_REF=$REF"
          sudo mkdir -p /mnt/openwrt && sudo chown -R "$USER:$(id -gn)" /mnt/openwrt
          git init -q /mnt/openwrt/src
          cd /mnt/openwrt/src
          git remote add origin "$REPO_URL"
          git fetch -q --depth 1 origin "$REF"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %s'
          echo "OPENWRT_DIR=/mnt/openwrt/src" >> "$GITHUB_ENV"
          echo "LOG_DIR=/mnt/openwrt/logs" >> "$GITHUB_ENV"
          df -h

      - name: 缓存 dl
        uses: actions/cache@v4
        with:
          path: /mnt/openwrt/src/dl
          key: xg040-tcboot-dl-${{ hashFiles('scripts/build-tcboot-local.sh', 'feeds.conf.default') }}
          restore-keys: |
            xg040-tcboot-dl-

      - name: 准备（feeds + 定制改动 + defconfig）
        run: bash scripts/build-tcboot-local.sh prepare

      - name: 上传最终 .config
        uses: actions/upload-artifact@v4
        with:
          name: defconfig-final
          path: /mnt/openwrt/logs/defconfig-final.config

      - name: 编译
        run: bash scripts/build-tcboot-local.sh build

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /mnt/openwrt/logs/build-errors.txt
            /mnt/openwrt/logs/NO_AIC8800
          if-no-files-found: ignore

      - name: 整理固件
        id: fw
        run: |
          cd "$OPENWRT_DIR/bin/targets/airoha/an7581"
          rm -rf packages
          # ImageBuilder 单独放到固定的 imagebuilder Release，供 xg-040g-md-ib.yml 使用，不混进固件 Release
          mkdir -p "$GITHUB_WORKSPACE/ib"
          mv openwrt-imagebuilder-*.tar.zst "$GITHUB_WORKSPACE/ib/" 2>/dev/null || true
          ls -l
          echo "dir=$PWD" >> "$GITHUB_OUTPUT"
          echo "tag=tcboot-$(date +%Y.%m.%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: 上传固件（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: XG-040G-MD-tcboot-${{ steps.fw.outputs.tag }}
          path: ${{ steps.fw.outputs.dir }}/*

      - name: 生成 Release 说明
        run: |
          cat > release.txt <<EOF
          XG-040G-MD（Web U-Boot 刷入，bell 机型）定制固件
          ----------------------
          构建时间：$(date +"%Y-%m-%d %H:%M")
          源码：$REPO_URL @ $(git -C "$OPENWRT_DIR" rev-parse --short HEAD)
          内核：6.12（openwrt-25.12）
          $( [ -f /mnt/openwrt/logs/NO_AIC8800 ] && echo '注意：AIC8800 驱动本次编译失败，固件不含 AIC8800 无线网卡驱动' )
          默认地址：192.168.1.1（root 无密码）
          刷机：在 Web U-Boot 恢复页面上传 *-bell_xg-040g-md-squashfs-factory.bin
          已刷本固件后升级：系统 → 备份/升级，用 *-bell_xg-040g-md-squashfs-sysupgrade.bin
          EOF

      - name: 更新 ImageBuilder（imagebuilder Release）
        if: hashFiles('ib/*.tar.zst') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view imagebuilder >/dev/null 2>&1 ||             gh release create imagebuilder --latest=false --title "ImageBuilder（供快速出包用）"               --notes "完整编译产出的 ImageBuilder，xg-040g-md-ib.yml 用它几分钟出固件。不是固件，不要刷。"
          gh release upload imagebuilder ib/*.tar.zst --clobber

      - name: 发布 Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.fw.outputs.tag }}
          bodyFile: release.txt
          artifacts: ${{ steps.fw.outputs.dir }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
